#for cnn model
confidence:
  threshold: 0.60

vision:
  # Fixed filename convention: to update the model, overwrite this file with a
  # new checkpoint (same architecture) — no code changes needed.
  checkpoint_path: "models/vision_model.pth"
  image_size: 224
  class_names: ["AD", "NORMAL"]
  device: "cpu"

#for faiss
retrieval:
  # Number of top-k documents to retrieve from the FAISS index.
  top_k: 2
  # Path to the locally saved FAISS index directory.
  db_path: "faiss_index"
  # HuggingFace sentence-transformer model used for embedding.
  embedding_model: "all-MiniLM-L6-v2"
  # Max FAISS L2 distance (lower = more similar) for a query to be treated as
  # in-scope. Empirically, real OCT/AD questions score ~0.7-1.0 against this
  # index; off-topic or injection-style questions score ~1.6+. Queries scoring
  # above this are declined without ever calling the LLM.
  relevance_distance_threshold: 1.3


llm:
  gemini:
    active: false
    model: "gemini-2.0-flash"
    # Lower = more deterministic/reproducible; higher = more creative.
    temperature: 0.0
  groq:
    # Groq's free tier: fast inference, no billing setup required.
    active: true
    model: "llama-3.3-70b-versatile"
    temperature: 0.0
  openai:
    active: false
    model: "gpt-4o-mini"
    temperature: 0.0
